services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:8080}
      DB_PATH: /app/runtime/uzhavan_saathee.db
      OLLAMA_HOST: ${OLLAMA_DOCKER_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3:latest}
      USE_MOCK_MODELS: ${USE_MOCK_MODELS:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./data/plant_disease:/app/data/plant_disease:ro
      - app-data:/app/runtime
      - app-data:/app/src/app/static/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/model_health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    command: ["serve"]
    volumes:
      - ollama-data:/root/.ollama
    expose:
      - "11434"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  app-data:
  ollama-data:
