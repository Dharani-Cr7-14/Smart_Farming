<div id="chatbot-container" style="position:fixed;bottom:20px;right:20px;z-index:9999;">
    <button id="chatbot-toggle" style="background:#45a29e;color:#fff;padding:12px 16px;border:none;border-radius:50%;cursor:pointer;">💬</button>
    <div id="chatbot-box" style="display:none;width:300px;height:400px;background:#1f2833;color:#fff;border-radius:12px;box-shadow:0 0 10px rgba(0,0,0,0.5);padding:10px;flex-direction:column;">
        <div id="chatbot-messages" style="flex:1;overflow-y:auto;margin-bottom:10px;"></div>
        <form id="chatbot-form" style="display:flex;">
            <input type="text" id="chatbot-input" placeholder="Type a message..." style="flex:1;padding:8px;border:none;border-radius:8px;outline:none;">
            <button type="submit" style="padding:8px 12px;background:#45a29e;color:#fff;border:none;border-radius:8px;margin-left:5px;">Send</button>
        </form>
    </div>
</div>

<script>
const toggleBtn = document.getElementById('chatbot-toggle');
const chatbotBox = document.getElementById('chatbot-box');
const form = document.getElementById('chatbot-form');
const input = document.getElementById('chatbot-input');
const messagesDiv = document.getElementById('chatbot-messages');

toggleBtn.onclick = () => {
    chatbotBox.style.display = chatbotBox.style.display === 'none' ? 'flex' : 'none';
};

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;

    // Show user message
    const userMsgDiv = document.createElement('div');
    userMsgDiv.innerText = message;
    userMsgDiv.style.background = '#66fcf1';
    userMsgDiv.style.color = '#0b0c10';
    userMsgDiv.style.padding = '6px 10px';
    userMsgDiv.style.borderRadius = '8px';
    userMsgDiv.style.margin = '5px 0';
    userMsgDiv.style.textAlign = 'right';
    messagesDiv.appendChild(userMsgDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;

    input.value = '';

    // Send to backend
    const formData = new FormData();
    formData.append('user_message', message);
    formData.append('lang', 'en');

    try {
        const res = await fetch('/chatbot_message', {
            method: 'POST',
            body: formData
        });

        const data = await res.json();

        // Show bot reply
        const botMsgDiv = document.createElement('div');
        botMsgDiv.innerText = data.reply;
        botMsgDiv.style.background = '#0b0c10';
        botMsgDiv.style.color = '#fff';
        botMsgDiv.style.padding = '6px 10px';
        botMsgDiv.style.borderRadius = '8px';
        botMsgDiv.style.margin = '5px 0';
        botMsgDiv.style.textAlign = 'left';
        messagesDiv.appendChild(botMsgDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

    } catch (err) {
        const errDiv = document.createElement('div');
        errDiv.innerText = "Sorry, cannot connect to chatbot.";
        errDiv.style.background = 'red';
        errDiv.style.color = 'white';
        errDiv.style.padding = '6px 10px';
        errDiv.style.borderRadius = '8px';
        errDiv.style.margin = '5px 0';
        messagesDiv.appendChild(errDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
});
</script>
